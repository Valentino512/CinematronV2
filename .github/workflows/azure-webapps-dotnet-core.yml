# This workflow will build and push a .NET Core app to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-dotnetcore?tabs=net60&pivots=development-environment-vscode
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and DOTNET_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: Build and deploy ASP.Net Core app to an Azure Web App

env:
  AZURE_WEBAPP_NAME: CinematronV2    # set this to the name of your Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10.0'                 # set this to the .NET version to use (match App Service runtime)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
              run: dotnet publish -c Release -o ./myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
                path: ./myapp

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Configure connection strings via Kudu (using publish profile)
        if: ${{ secrets.AZURE_SQL_CONNECTION_STRING != '' }}
        run: |
          set -euo pipefail
          echo "$AZURE_WEBAPP_PUBLISH_PROFILE" > publish.xml
          python - <<'PY' > pubinfo.txt
import xml.etree.ElementTree as ET, os
s = os.environ.get('AZURE_WEBAPP_PUBLISH_PROFILE')
root = ET.fromstring(s)
for p in root.findall('publishProfile'):
    if p.get('publishMethod') in ('ZipDeploy','MSDeploy'):
        print(p.get('publishUrl'))
        print(p.get('userName'))
        print(p.get('userPWD'))
        break
else:
    p = root.findall('publishProfile')[0]
    print(p.get('publishUrl'))
    print(p.get('userName'))
    print(p.get('userPWD'))
PY
          publishUrl=$(sed -n '1p' pubinfo.txt)
          username=$(sed -n '2p' pubinfo.txt)
          password=$(sed -n '3p' pubinfo.txt)
          host=${publishUrl%%:*}
          kudu=https://$host
          # Build JSON payload for Kudu connectionstrings API
          conn=$(printf '%s' "$AZURE_SQL_CONNECTION_STRING" | sed 's/"/\\"/g')
          json='{"DefaultConnection":{"value":"'"$conn"'","type":"SQLAzure"}}'
          echo "Calling Kudu at $kudu/api/connectionstrings"
          http_code=$(curl -s -o /tmp/kuduresp -w "%{http_code}" -u "$username:$password" -X PUT -H "Content-Type: application/json" -d "$json" "$kudu/api/connectionstrings")
          cat /tmp/kuduresp
          echo "Kudu HTTP status: $http_code"
          if [ "$http_code" -ge 400 ]; then echo "Kudu update failed"; exit 1; fi
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Deploy to Azure Web App using Publish Profile
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./myapp
